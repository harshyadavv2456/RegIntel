name: RegIntel Hourly Feed Update
# Production feed runner: hourly plus manual/bootstrap execution on workflow changes.

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/regintel-hourly.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regintel-hourly
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run regulatory ingestion
        run: |
          npx tsx -e "import { runScrapeAndSummarizePipeline } from './server/scrapers/orchestrator.ts'; runScrapeAndSummarizePipeline().then(r => { console.log(JSON.stringify(r, null, 2)); }).catch(e => { console.error(e); process.exit(1); })"

      - name: Generate production data snapshot
        run: |
          node <<'NODE'
          const fs = require('fs');
          const input = 'data/regintel_db.json';
          const output = 'server/data.generated.ts';
          const publicOutput = 'data/public_api.json';
          if (!fs.existsSync(input)) throw new Error('Missing data/regintel_db.json');
          const db = JSON.parse(fs.readFileSync(input, 'utf8'));
          const source =
            '// Generated from data/regintel_db.json by the RegIntel ingestion workflow. Do not edit manually.\n' +
            'export const GENERATED_DB = ' + JSON.stringify(db) + ' as const;\n';
          fs.writeFileSync(output, source);
          const publicPayload = {
            api: 'RegIntel Public API',
            version: 'v1',
            generatedAt: db.notifications?.[0]?.scrapedAt || null,
            refreshCadence: 'Every 15 minutes',
            coverage: ['SEBI', 'RBI', 'MCA', 'CBDT', 'CBIC'],
            notificationCount: db.notifications?.length || 0,
            notifications: db.notifications || [],
            sources: db.scraperSources || []
          };
          fs.writeFileSync(publicOutput, JSON.stringify(publicPayload, null, 2) + '\n');
          console.log('Generated ' + output + ' and ' + publicOutput + ': ' + (db.notifications?.length || 0) + ' notifications');
          NODE

      - name: Show data changes
        run: |
          if [ -f data/regintel_db.json ]; then
            echo "Database generated:"
            wc -c data/regintel_db.json
            echo "Production snapshot:"
            wc -c server/data.generated.ts
            echo "Public API snapshot:"
            wc -c data/public_api.json
            git status --short
          else
            echo "::error::Scraper completed without generating data/regintel_db.json"
            exit 1
          fi

      - name: Commit updated feed
        run: |
          git config user.name "regintel-bot"
          git config user.email "regintel-bot@users.noreply.github.com"
          git add data/regintel_db.json server/data.generated.ts data/public_api.json
          if git diff --cached --quiet; then
            echo "No new regulatory data."
          else
            git commit -m "chore: update regulatory intelligence feed"
            git push origin main
          fi
