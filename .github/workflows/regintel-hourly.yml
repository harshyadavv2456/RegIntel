name: RegIntel 5-Minute Feed Update
# Production feed runner: every 5 minutes. No synthetic fallback data is permitted.
# Manual production refresh trigger: 2026-10-04T19:46 IST

on:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/regintel-hourly.yml'
      - 'server/**'
      - 'api/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regintel-hourly
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run lint
      - name: Run regulatory ingestion
        run: |
          npx tsx -e "import { runScrapeAndSummarizePipeline } from './server/scrapers/orchestrator.ts'; runScrapeAndSummarizePipeline().then(r => { const failures = r.results.filter(x => !x.success); const summary = ['### RegIntel ingestion', '', 'New verified items: ' + r.newItemsIngested, 'Items found: ' + r.totalItemsFound, 'Source failures: ' + failures.length, ...failures.map(x => '- ' + x.regulator + ': ' + x.message)].join('\\n'); require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\\n'); console.log(JSON.stringify(r, null, 2)); if (failures.length === r.results.length) process.exit(1); }).catch(e => { console.error(e); process.exit(1); })"
      - name: Generate production data snapshot
        run: |
          node <<'NODE'
          const fs = require('fs');
          const input = 'data/regintel_db.json';
          const output = 'server/data.generated.ts';
          const publicOutput = 'data/public_api.json';
          if (!fs.existsSync(input)) throw new Error('Missing data/regintel_db.json');
          const db = JSON.parse(fs.readFileSync(input, 'utf8'));
          const source =
            '// Generated from data/regintel_db.json by the RegIntel ingestion workflow. Do not edit manually.\n' +
            'export const GENERATED_DB = ' + JSON.stringify(db) + ' as any;\n';
          fs.writeFileSync(output, source);
          const publicPayload = {
            api: 'RegIntel Public API',
            version: 'v1',
            generatedAt: new Date().toISOString(),
            refreshCadence: 'Every 5 minutes',
            coverage: ['SEBI', 'RBI', 'MCA', 'CBDT', 'CBIC'],
            notificationCount: db.notifications?.length || 0,
            notifications: db.notifications || [],
            sources: db.scraperSources || []
          };
          fs.writeFileSync(publicOutput, JSON.stringify(publicPayload, null, 2) + '\n');
          console.log('Generated snapshots: ' + (db.notifications?.length || 0) + ' notifications');
          NODE
      - name: Commit updated feed
        run: |
          git config user.name "regintel-bot"
          git config user.email "regintel-bot@users.noreply.github.com"
          git add data/regintel_db.json server/data.generated.ts data/public_api.json
          if git diff --cached --quiet; then
            echo "No new regulatory data."
          else
            git commit -m "chore: update regulatory intelligence feed"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
