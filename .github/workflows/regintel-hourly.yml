name: RegIntel Hourly Feed Update

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/regintel-hourly.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regintel-hourly
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run regulatory ingestion
        run: |
          npx tsx -e "import { runScrapeAndSummarizePipeline } from './server/scrapers/orchestrator.ts'; runScrapeAndSummarizePipeline().then(r => { console.log(JSON.stringify(r, null, 2)); }).catch(e => { console.error(e); process.exit(1); })"

      - name: Show data changes
        run: |
          if [ -f data/regintel_db.json ]; then
            echo "Database generated:"
            wc -c data/regintel_db.json
            git status --short
          else
            echo "::error::Scraper completed without generating data/regintel_db.json"
            exit 1
          fi

      - name: Commit updated feed
        run: |
          git config user.name "regintel-bot"
          git config user.email "regintel-bot@users.noreply.github.com"
          git add data/regintel_db.json
          if git diff --cached --quiet; then
            echo "No new regulatory data."
          else
            git commit -m "chore: update regulatory intelligence feed"
            git push origin main
          fi
